services:
  mongo_db:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - neurotask
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" localhost:27017/admin
      interval: 10s
      timeout: 5s
      retries: 10

  micro_user:
    build: ./microUser
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
    expose:
      - "3009"
    depends_on:
      mongo_db:
        condition: service_healthy
    networks:
      - neurotask

  micro_projects:
    build: ./microProjects
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
    expose:
      - "3008"
    depends_on:
      mongo_db:
        condition: service_healthy
      micro_user:
        condition: service_started
    networks:
      - neurotask

  micro_task:
    build: ./microTask
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
    expose:
      - "3007"
    depends_on:
      mongo_db:
        condition: service_healthy
      micro_projects:
        condition: service_started
    networks:
      - neurotask

  micro_coments:
    build: ./microMensajes
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
    expose:
      - "3010"
    depends_on:
      mongo_db:
        condition: service_healthy
      micro_task:
        condition: service_started
    networks:
      - neurotask

  micro_analisis:
    build: ./microAnalisis
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
    expose:
      - "3011"
    depends_on:
      mongo_db:
        condition: service_healthy
    networks:
      - neurotask

  frontend:
    build: ./frontNeuroTask
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - micro_user
      - micro_projects
      - micro_task
      - micro_coments
      - micro_analisis
    networks:
      - neurotask

  sparkanalytics:
    build: ./SparkAnalytics
    profiles:
      - analytics
    environment:
      MONGO_URI: ${MONGO_URI}
    depends_on:
      mongo_db:
        condition: service_healthy
    networks:
      - neurotask

  kong:
    image: kong:3.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8001"
    volumes:
      - ./kong.yaml:/kong/declarative/kong.yaml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    depends_on:
      - micro_user
      - micro_projects
      - micro_task
      - micro_coments
      - micro_analisis
    networks:
      - neurotask

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - kong
    networks:
      - neurotask

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - neurotask

networks:
  neurotask:
    driver: bridge

volumes:
  mongo_data:
  grafana_data:
